services:
  - type: web
    name: virat-vps-panel
    runtime: python
    region: oregon # or frankfurt, singapore, ohio
    plan: starter  # Use 'free' if you don't need persistent disk storage
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers=1 --threads=8 --timeout=120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 5000
    disk:
      name: panel-storage
      mountPath: /opt/render/project/src/data
      sizeGB: 5